name: diag
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [diag.py, .github/workflows/diag.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lbzip2
      - run: python3 -u diag.py 300000
