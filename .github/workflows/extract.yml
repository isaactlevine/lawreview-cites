name: extract
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [lawrev_cites.py, .github/workflows/extract.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lbzip2
      - name: Probe file formats
        run: python3 -u lawrev_cites.py --stream --probe --dir "$RUNNER_TEMP/lr"
      - name: Extract citations
        run: python3 -u lawrev_cites.py --stream --dir "$RUNNER_TEMP/lr"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: ${{ runner.temp }}/lr/out
          retention-days: 60
      - name: Commit results to the repository
        if: always()
        run: |
          mkdir -p results && cp -r "$RUNNER_TEMP/lr/out/." results/ || true
          gzip -f results/all_journal_cites.csv || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results && git commit -m "Results from run $GITHUB_RUN_ID" && git push || true
